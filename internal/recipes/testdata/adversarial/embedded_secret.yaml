# adversary: T18 — embedded literal secret in query template (loader accepts; opt-in scanner WARNs)
apiVersion: dashgen.io/v1
kind: Recipe
metadata:
  name: embedded_secret
  section: traffic
  profile: service
  confidence: 0.5
  tier: v0.3
match:
  type: counter
  name_equals: http_requests_total
panels:
  - title_template: "x"
    unit: ops/sec
    # Hardcoded API key — the loader has no semantic notion of "secret", so the
    # recipe loads cleanly. Out-of-scope for loader; future opt-in lint scanner
    # surfaces this as a WARN. Documented as user-error mitigation (T18).
    query_template: |
      rate({{ .Metric }}{api_key="sk-test-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}[5m])
    legend_template: "x"
