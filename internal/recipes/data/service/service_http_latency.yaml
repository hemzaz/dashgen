apiVersion: dashgen.io/v1
kind: Recipe
metadata:
  name: service_http_latency
  section: latency
  profile: service
  confidence: 0.75
  tier: v0.3
  description: "HTTP request latency p50/p95/p99 from a histogram carrying both the latency_histogram and service_http traits."
  tags: [http, latency, histogram, quantile]

match:
  type: histogram
  all_traits: [latency_histogram, service_http]

panels:
  - title_template: 'Latency (p50/p95/p99): {{ .Metric }}'
    kind: timeseries
    unit: s
    quantiles: [0.5, 0.95, 0.99]
    preferred_labels: [route, handler]
    query_template: 'histogram_quantile({{ .Quantile2 }}, sum by ({{ groupByWithSorted . "le" }}) (rate({{ bucketName .Metric }}[{{ .Window }}])))'
    legend_template: 'p{{ .Quantile100 }} {{ legendFor . }}'
    rationale_template: 'Latency histogram "{{ .Metric }}"; p50/p95/p99 via histogram_quantile over {{ .Window }} with le grouping.'
