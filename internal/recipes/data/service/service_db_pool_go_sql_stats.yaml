apiVersion: dashgen.io/v1
kind: Recipe
metadata:
  name: service_db_pool_go_sql_stats
  section: saturation
  profile: service
  confidence: 0.80
  tier: v0.3
  description: "DB connection pool saturation ratio for stdlib sql.DB (go_sql_stats counters)."
  tags: [db, pool, saturation, gauge, pair]

pair_with:
  suffix_swap: { from_suffix: "_in_use", to_suffix: "_max" }
  on_missing: omit

match:
  type: gauge
  name_equals: go_sql_stats_connections_in_use

panels:
  - title_template: 'DB pool utilization: go_sql'
    kind: timeseries
    unit: percentunit
    group_by: [instance, job]
    requires_pair: true
    query_template: 'go_sql_stats_connections_in_use / go_sql_stats_connections_max'
    legend_template: '{{ legendFor . }}'
    rationale_template: 'go_sql_stats_connections_in_use / go_sql_stats_connections_max: connection pool utilisation ratio. Values near 1.0 indicate pool exhaustion.'
