apiVersion: dashgen.io/v1
kind: Recipe
metadata:
  name: infra_disk_iops
  section: disk
  profile: infra
  confidence: 0.85
  tier: v0.3
  description: "Disk read and write IOPS from node_exporter completed-operations counters."
  tags: [disk, iops, node_exporter, counter]

match:
  type: counter
  name_equals_any: [node_disk_reads_completed_total, node_disk_writes_completed_total]

panels:
  - title_template: '{{ if eq .Metric "node_disk_reads_completed_total" }}Disk read IOPS{{ else }}Disk write IOPS{{ end }}'
    kind: timeseries
    unit: iops
    group_by: [instance, device]
    query_template: 'sum by ({{ groupBy . }}) (rate({{ .Metric }}[{{ .Window }}]))'
    legend_template: '{{ legendFor . }}'
    rationale_template: 'node_exporter counter "{{ .Metric }}"; rate over {{ .Window }} per instance+device.'
