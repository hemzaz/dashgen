name: e2e

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker
        run: docker info

      - name: Run e2e suite
        run: go test -tags=e2e -timeout 10m -v ./e2e/...
